[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dreamgate"
version = "0.3.0"
description = "Thermodynamic signal intelligence — detect when a signal has genuinely changed state"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Rudolph van Rensburg" }]
requires-python = ">=3.10"
dependencies = []
keywords = ["anomaly-detection", "signal-processing", "thermodynamics", "machine-learning"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
dev = ["pytest>=7", "build", "twine"]

[project.urls]
Homepage = "https://github.com/Predictive-Entropy-Cryptography/dreamgate"
Repository = "https://github.com/Predictive-Entropy-Cryptography/dreamgate"

[tool.setuptools.packages.find]
where = ["."]
include = ["dreamgate*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
